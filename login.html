<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Espaço Beleza</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>ESPAÇO BELEZA</h1>

    <button onclick="location.href='index.html'">
        Voltar
    </button>

</header>

<main>

    <h2>Entrar</h2>

    <p>Acesse sua conta.</p>

    <label>E-mail</label>
    <input
        id="email"
        type="email"
        placeholder="Digite seu e-mail"
    >

    <br><br>

    <label>Senha</label>
    <input
        id="senha"
        type="password"
        placeholder="Digite sua senha"
    >

    <br><br>

    <button onclick="login()">
        Entrar
    </button>

    <div id="msg-login"></div>

    <br>

    <button onclick="location.href='criar_conta.html'">
        Criar conta
    </button>

</main>

<script src="app.js"></script>

</body>
</html>
